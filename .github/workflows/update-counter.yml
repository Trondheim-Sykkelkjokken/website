name: Update fixed bikes counter

on:
  schedule:
    - cron: '7 3 * * 4'  #  “At 03:07 on Thursday.” Offset from :00 to avoid GitHub's high-contention top-of-hour scheduling delays.
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: sudo apt-get purge -y man-db  # Speeds up install step
      - run: sudo apt-get update
      - run: sudo apt-get install -y jq curl moreutils
      - run: src/lib/data/update-stats.sh
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d  # v7.2.0
        with:
          commit_message: 'Chore: Update fixed bikes counter'
